<!DOCTYPE html>
<html>
<head>
    <title>My E-Commerce Store</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f2f2f2;
        }

        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: #555;
            text-align: center;
            padding: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .product {
            background-color: white;
            width: 200px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 5px gray;
        }

        .product img {
            width: 150px;
            height: 150px;
        }

        button {
            background-color: green;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My E-Commerce Store</h1>
        <p>Shop Easily and Quickly</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <h2>Our Products</h2>

    <div class="products">

        <div class="product">
            <img src="https://via.placeholder.com/150" alt="Mobile">
            <h3>Smart Phone</h3>
            <p>Price: ₹15,000</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/150" alt="Laptop">
            <h3>Laptop</h3>
            <p>Price: ₹45,000</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/150" alt="Headphones">
            <h3>Headphones</h3>
            <p>Price: ₹2,000</p>
            <button>Add to Cart</button>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 My E-Commerce Store</p>
    </footer>

</body>
</html>
